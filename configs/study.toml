# Default study, sized to finish in under 45 minutes of wall time on 3 worker processes.
# Projection (to be replaced by measurements at M2/M5): fetch ~100 models x 5 tasks with
# column projection, ~0.3-0.5 GB, 10-15 min; fits, 200 item bootstrap replicates,
# 5 leave-one-family-out refits and 20 planted-key replicates, 10-15 min.
# Needs an HF token whose account has accepted the conditions of each details repository.

[study]
name = "study-v1"
seed = 20261024
out_dir = "runs/study-v1"
benchmarks = ["mmlu_pro", "gpqa", "bbh_ld3", "bbh_navigate", "bbh_object_counting"]

[panel]
# open-llm-leaderboard/contents at the last update before the leaderboard was archived.
contents_revision = "9c09a7cae43334062a82cb164f2ef255013dafa2"
n_models = 100
min_models = 60
min_mmlu_pro_raw = 0.15
max_per_family = 2
top_quintile_cap = 40
per_other_quintile = 15
dedupe_agreement = 0.95

[data]
